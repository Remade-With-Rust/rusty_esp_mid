[workspace]
resolver = "3"
members = ["crates/*"]
# Per-chip firmware examples are their own cargo projects: each needs its own
# target, linker script and (for Xtensa) toolchain. They are never workspace
# members. See firmware/README.md.
exclude = ["firmware/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Remade-With-Rust/rusty_esp_mid"
homepage = "https://www.mata.network/"
authors = ["Remade With Rust"]
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
# esp-idf-sys registers only the sdkconfig symbols that are SET as known cfgs;
# the two `rusty_esp_mid-esp` reads may legitimately be unset (a development
# board), so tell rustc they are expected.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(esp_idf_nvs_encryption)", "cfg(esp_idf_secure_flash_enc_enabled)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
# Internal crates carry BOTH path and version so the set publishes to crates.io
# in lockstep (the rusty_time pattern).
rusty_esp_mid-core = { path = "crates/rusty_esp_mid-core", version = "0.1.0", default-features = false }
rusty_esp_mid-esp = { path = "crates/rusty_esp_mid-esp", version = "0.1.0", default-features = false }

# Siblings in the Janus family are consumed BY GIT URL so this repo deploys on
# its own. Inside the Janus umbrella folder, `.cargo/config.toml` patches the
# URL to the sibling checkout, so local edits are visible without a push.
rusty_esp_core = { version = "0.1", git = "https://github.com/Remade-With-Rust/rusty_esp_core", default-features = false }

# Crypto — RustCrypto only, pinned to the majors the `mid` repository uses so
# the whole family agrees on one P-256 and one SHA-2 in a build graph.
# `ecdsa` pulls `signing` + `verifying` (+ `hazmat` for prehash signing); `ecdh`
# is for rusty_esp_signal's session keys. No `std` here: the core is no_std.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh"] }
sha2 = { version = "0.10", default-features = false }
bs58 = { version = "0.5", default-features = false }
base64 = { version = "0.22", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# Host-side oracles for the tests: the real `mid` crates, by git.
mid-types = { version = "0.2", git = "https://github.com/Remade-With-Rust/mid", branch = "device-signer-leaf", default-features = false }
mid-signer = { version = "0.2", git = "https://github.com/Remade-With-Rust/mid", branch = "device-signer-leaf", default-features = false }
mid-verify = { git = "https://github.com/Remade-With-Rust/mid", branch = "device-signer-leaf" }
mid-issuer = { git = "https://github.com/Remade-With-Rust/mid", branch = "device-signer-leaf" }
kms-types = { git = "https://github.com/Remade-With-Rust/mid", branch = "device-signer-leaf" }
kms-verifier = { git = "https://github.com/Remade-With-Rust/mid", branch = "device-signer-leaf" }
kms-client = { git = "https://github.com/Remade-With-Rust/mid", branch = "device-signer-leaf" }
mata-cap = { git = "https://github.com/Remade-With-Rust/mid", branch = "device-signer-leaf" }

[profile.release]
lto = "thin"
codegen-units = 1

# THE JSON SWAP (rusty_json_turbo). One table converts the WHOLE graph.
#
# `serde_json` here is the house fork, `Remade-With-Rust/rusty_json_turbo`: a
# performance fork whose output is byte-identical to upstream's by contract,
# gated per commit against upstream serde_json linked in the same process --
# bytes, `Value`, error text with line and column, float bit patterns and
# `StreamDeserializer` offsets. Its LIBRARY is still called `serde_json`, so
# every `use serde_json::...` line in this repository is untouched.
#
# WHY A PATCH AND NOT A RENAMED DEPENDENCY. Writing
# `serde_json = { package = "rusty_json_turbo", ... }` would convert only the
# JSON this repository calls itself, leaving every third-party copy on
# upstream -- and the two would then be DIFFERENT TYPES, so a `Value` handed
# across that boundary would not compile. A patch converts every copy at once
# and leaves exactly one `Value` in the graph.
#
# The patch target is a shim package inside the fork named `serde_json`, which
# exists because `[patch]` matches on PACKAGE name and the fork's package is
# `rusty_json_turbo`. See that repository's `crates/serde_json-shim/`.
[patch.crates-io]
serde_json = { git = "https://github.com/Remade-With-Rust/rusty_json_turbo", branch = "master" }
