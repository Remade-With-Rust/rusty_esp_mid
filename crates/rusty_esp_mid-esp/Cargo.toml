[package]
name = "rusty_esp_mid-esp"
description = "Chip backends for rusty_esp_mid: the WRAP crate. `esp-idf` (Track A) gives the device key a home in NVS behind the Kv seam, with the encryption check the plan demands, and the TRNG behind Rng; `esp-hal` (Track B) lands with its drivers. The only crate in the workspace allowed a fenced unsafe block, and only at an FFI boundary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rusty_esp_mid-esp"
keywords = ["esp32", "embedded", "esp-hal", "esp-idf", "remade-with-rust"]
categories = ["embedded", "no-std", "cryptography"]

[features]
default = []
std = ["rusty_esp_mid-core/std"]
alloc = ["rusty_esp_mid-core/alloc"]
# Track B — bare metal: `hal::{PartitionFlash, find_partition, EspHalRng}`
# over esp-hal and esp-storage. The chip is chosen by the firmware
# (`esp-storage/esp32s3` and the like); no `alloc` is needed for them, so
# the core-only rung stays measurable underneath.
esp-hal = ["dep:esp-hal", "dep:esp-storage"]
# Track A — std on ESP-IDF via esp-idf-svc: `idf::{EspNvsKv, EspRng}`.
esp-idf = ["std", "dep:esp-idf-svc"]
# Development only: let `EspNvsKv::open` accept a plaintext NVS partition.
# A shipping firmware never enables this; the ledger records builds that do.
allow-insecure-dev = []

[dependencies]
rusty_esp_mid-core = { workspace = true }
esp-idf-svc = { version = "0.52", optional = true }
# Caret, not `=`: the firmware pins the companion set (esp-hal 1.2.0 /
# esp-storage 0.10.0 today) and selects the chip.
esp-hal = { version = "1.2", default-features = false, features = ["unstable"], optional = true }
esp-storage = { version = "0.10", optional = true }

[build-dependencies]
# Re-emits esp-idf-sys's cfgs to this crate (build.rs); a no-op on the host.
embuild = { version = "0.33", features = ["espidf"] }

[lints]
workspace = true
