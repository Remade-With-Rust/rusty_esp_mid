[package]
name = "rusty_esp_mid-core"
description = "MATA mID on the chip, the pure core: a P-256 device did:mata, the byte-identical DeviceSigner, kms nonce assertions, JWS ES256, the self-issued mID token, capability matching, the owner Adoption grant, a replay window and manifest signing. no_std, forbid(unsafe), no drivers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rusty_esp_mid-core"
keywords = ["esp32", "embedded", "no-std", "mata", "identity"]
categories = ["embedded", "no-std", "cryptography", "authentication"]

[features]
default = ["std"]
# The feature ladder is the rusty_zstd one: `std` implies `alloc`; with neither,
# the crate is pure `core` (keys, signing, the kms canonical form over borrowed
# fields, adoption, nonce window, manifest signing) and builds on riscv32 bare
# metal. `alloc` adds the JSON shapes (kms envelopes, JWS, the self-issued mID
# token) and owned DID strings.
std = [
    "alloc",
    "rusty_esp_core/std",
    "p256/std",
    "sha2/std",
    "bs58/std",
    "base64/std",
    "serde?/std",
    "serde_json?/std",
    "mid-types?/std",
    "mid-signer/std",
]
alloc = [
    "rusty_esp_core/alloc",
    "p256/alloc",
    "bs58/alloc",
    "base64/alloc",
    "dep:serde",
    "serde?/alloc",
    "dep:serde_json",
    "dep:mid-types",
    "mid-signer/alloc",
]

[dependencies]
# The mID wire types and canonical bytes, shared with mid-issuer / mid-verify
# (M5): this crate signs them, it no longer defines them.
mid-types = { workspace = true, optional = true }
rusty_esp_core = { workspace = true }
# The device-signing seam itself, from upstream: the trait this crate used to copy.
mid-signer = { workspace = true }
p256 = { workspace = true }
sha2 = { workspace = true }
bs58 = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# The oracles: device-issued bytes must verify with the real mid / kms crates.
mid-verify = { workspace = true }
mid-issuer = { workspace = true }
kms-types = { workspace = true }
kms-verifier = { workspace = true }
kms-client = { workspace = true }
mata-cap = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = { version = "1" }
p256 = { version = "0.13", features = ["ecdsa", "std"] }
# The high-s twin test re-encodes a JWS segment.
base64 = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }

[lints]
workspace = true
