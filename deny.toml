# cargo-deny configuration — the permissive-only, no-C posture, enforced.
# Run: cargo deny check

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A `*-sys` crate is a decision stated out loud in the PR, never a default.
deny = [
  { crate = "openssl-sys", reason = "no C toolchain anywhere in the build" },
  { crate = "libz-sys", reason = "use rusty_zstd / pure-Rust inflate" },
  { crate = "zstd-sys", reason = "use rusty_zstd" },
  { crate = "ring", reason = "platform asm; use RustCrypto / rustls-rustcrypto" },
  { crate = "aws-lc-sys", reason = "C; use RustCrypto / rustls-rustcrypto" },
]

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  # The identity crates this device half is the oracle for.
  "https://github.com/Remade-With-Rust/mid",
  # The house serde_json fork: this workspace swaps the whole graph onto it
  # (see the note above `[dependencies]`), so its source has to be allowed
  # or every crate that comes through it is an unknown git source.
  "https://github.com/Remade-With-Rust/rusty_json_turbo",
]
